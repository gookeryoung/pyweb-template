[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115.0",
    "fastapi-offline>=1.7.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
    "alembic>=1.14.0",
    "bcrypt>=4.0.0,<5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "httpx2>=2.0",
]

description = "Template for python web apps. (FastAPI + SQLAlchemy + Plugin 架构)"
license = "MIT"
name = "pyweb_template"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.2"

# CLI 入口（短名 pywt）
[project.scripts]
pywt = "pyweb_template.runner:main"

[project.optional-dependencies]
# 开发（包含 lint/test/docs）
dev = ["pyweb_template[lint,test,docs]"]

docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = [
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyweb_template"]
# 排除 static 目录的常规包收集，避免与 force-include 重复
# （force-include 会把 src/pyweb_template/static 映射到 pyweb_template/static）
exclude = ["src/pyweb_template/static/**"]

[tool.hatch.build.targets.wheel.force-include]
# 类型标记文件
"src/pyweb_template/py.typed" = "pyweb_template/py.typed"
# 前端 Vite 构建产物（已由 make frontend-build 生成到 src/pyweb_template/static/）
"src/pyweb_template/static" = "pyweb_template/static"

[tool.hatch.build.targets.sdist]
# sdist 排除开发工具缓存和前端依赖
exclude = [
    "frontend/node_modules/**",
    "frontend/dist/**",
    ".benchmarks/**",
    ".tox/**",
    ".mypy_cache/**",
    ".pyrefly_cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    "htmlcov/**",
    "dist/**",
    "build/**",
    "*.egg-info/**",
]

[tool.hatch.build.targets.sdist.force-include]
# sdist 必须包含 wheel force-include 的源文件，否则从 sdist 构建 wheel 会找不到
"src/pyweb_template/static" = "src/pyweb_template/static"

[tool.uv]
required-version = ">=0.5.0"

[[tool.uv.index]]
default = true
url = "https://mirrors.aliyun.com/pypi/simple/"

[dependency-groups]
dev = ["pyweb_template[dev]"]

[tool.coverage.run]
omit = [
    "src/pyweb_template/runner.py",
]
