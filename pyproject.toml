[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]

# 核心运行时依赖（继承 endo 的精简栈）
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

description     = "Template for python web apps. (FastAPI + SQLAlchemy + Plugin 架构)"
license         = "MIT"
name            = "pyweb_template"
readme          = "README.md"
requires-python = ">=3.13"
version         = "0.1.0"

# CLI 入口（短名 pywt）
[project.scripts]
pywt = "pyweb_template.runner:main"

[project.optional-dependencies]
# 开发（包含 lint/test/docs）
dev = ["pyweb_template[lint,test,docs]"]
# 数据库迁移
db = ["alembic>=1.14.0"]
# 认证授权（JWT + 密码哈希）
auth = [
    "bcrypt>=4.0.0,<5.0.0",
    "python-jose[cryptography]>=3.3.0",
]
# 文件上传与处理
upload = ["python-multipart>=0.0.9"]
# 异步任务（Celery + Redis）
async = [
    "celery>=5.4.0",
    "redis>=5.0.0",
]
# demo 运行依赖（httpx 客户端）
demo = ["httpx>=0.28.0"]

docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = [
    "httpx>=0.28.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
]

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyweb_template"]

[tool.hatch.build.targets.wheel.force-include]
"src/pyweb_template/py.typed" = "pyweb_template/py.typed"

[tool.uv]
required-version = ">=0.5.0"

[[tool.uv.index]]
default = true
url     = "https://mirrors.aliyun.com/pypi/simple/"


[dependency-groups]
dev = ["pyweb_template[dev]"]
